<style>
:root{--canvas:#120e14;--raised:#1d1722;--overlay:#251d2c;--inset:#0e0b12;--line:rgba(255,240,220,.08);--line2:rgba(255,240,220,.16);--text:#f3eee8;--text2:#cdbfb3;--text3:#9a8c82;--dig:#f5c542;--ink:#1b1b24;--boost:#ff5fa2;--xp:#5fbf4a;--info:#4fe0f0;--danger:#ff6b57;--dirt:#7a4a2c;--clay:#a8683f;--rock:#4a4a58;--grass:#5fbf4a;--r:4px;--ctl:44px;--sh:0 3px 0 #000;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--canvas);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;font:15px/1.4 "Noto Sans",system-ui,sans-serif;color:var(--text)}
#wrap{position:relative;height:100%;max-width:56.25vh;margin:0 auto;overflow:hidden}
canvas#c{display:block;width:100%;height:100%;outline-offset:-4px}
.pxc{display:block;image-rendering:pixelated}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.strata{height:10px;flex:none;background:linear-gradient(var(--grass) 0 3px,var(--dirt) 3px 6px,var(--clay) 6px 8px,var(--rock) 8px)}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 18px;background:linear-gradient(#120e14f5 70%,#120e1400);pointer-events:none}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
#logo{height:24px;width:auto;display:block}
.hbtns{display:flex;gap:6px}
.icon-btn{pointer-events:auto;min-width:var(--ctl);height:var(--ctl);border:0;border-radius:var(--r);background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2),var(--sh);display:grid;place-items:center}
.icon-btn:active,.slot:active,.btn:active,.buy:active{transform:translateY(2px);box-shadow:inset 0 0 0 1px var(--line2),0 1px 0 #000}
.icon-btn[aria-expanded=true]{box-shadow:inset 0 0 0 2px var(--dig),var(--sh)}
#depthBox{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:2px}
.xprow{display:flex;align-items:center;gap:8px;margin-top:10px}
.badge{display:grid;place-items:center;min-width:46px;height:24px;padding:0 6px;background:var(--ink);border-radius:var(--r);box-shadow:inset 0 0 0 2px var(--dig)}
#xpbar{flex:1;height:16px;background:var(--inset);border-radius:2px;box-shadow:inset 0 0 0 2px #000,0 0 0 1px var(--line2);overflow:hidden;position:relative}
#xpfill{height:100%;width:0;background:linear-gradient(#9be872 0 28%,var(--xp) 28% 68%,#3e8f34 68%);transition:width .35s var(--ease)}
#xpbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(0,0,0,.5) calc(10% - 2px) 10%)}
#xpnum{min-width:78px;text-align:right;font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border:0;border-radius:var(--r);background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2);font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums}
.chip b{color:var(--text)}
#dirtChip{pointer-events:none}
#dailyChip.done{box-shadow:inset 0 0 0 1px var(--xp);color:var(--xp)}
.fl{display:inline-flex;align-items:center;gap:3px;margin-left:4px;color:#ffb45a}
/* core sample */
#core{position:absolute;right:8px;top:212px;bottom:118px;width:18px;pointer-events:none}
#coreTop{position:absolute;right:0;top:0}#coreBot{position:absolute;right:0;bottom:14px}#coreNext{position:absolute;right:0;bottom:0}
#coreTube{position:absolute;left:3px;right:3px;top:18px;bottom:34px;border-radius:2px;background:linear-gradient(var(--grass) 0 3%,var(--dirt) 3% 55%,var(--clay) 55% 88%,var(--rock) 88%);box-shadow:0 0 0 2px #000,0 0 0 3px var(--line2)}
#coreTube::after{content:"";position:absolute;left:0;right:0;bottom:0;top:calc(var(--p,0)*100%);background:rgba(10,8,14,.8);z-index:0}
#coreMarks i{position:absolute;left:1px;right:1px;height:3px;transform:translateY(-1px);z-index:1}
#coreMarks i.unk{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
#coreYou{position:absolute;left:-11px;top:calc(var(--p,0)*100%);border:5px solid transparent;border-left:7px solid var(--dig);transform:translateY(-5px);z-index:2;transition:top .3s var(--ease)}
/* toasts */
#toasts{position:absolute;left:12px;right:36px;top:200px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:5}
.toast{display:flex;max-width:100%;background:var(--overlay);border-radius:var(--r);box-shadow:0 0 0 1px var(--line2),var(--sh);overflow:hidden;animation:tin .28s var(--ease) both}
.toast .edge{width:6px;flex:none;background:linear-gradient(var(--grass) 0 14%,var(--dirt) 14% 58%,var(--clay) 58% 84%,var(--rock) 84%)}
.toast .tb{padding:9px 12px}.toast .sub{font-size:13px;color:var(--text2);margin-top:5px}
.toast.out{animation:tout .2s ease both}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}@keyframes tout{to{transform:translateY(-6px);opacity:0}}
#hint{position:absolute;left:0;right:0;bottom:104px;display:flex;justify-content:center;pointer-events:none;transition:opacity .4s}#hint .pxc{animation:hint 1.6s steps(2) infinite}
@keyframes hint{50%{opacity:.35}}
/* dock */
#dock{position:absolute;left:0;right:0;bottom:0;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;background:linear-gradient(#120e1400,#120e14f2 40%);z-index:6}
.slot{position:relative;height:66px;border:0;border-radius:6px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2),var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;overflow:hidden}
.slot[aria-expanded=true]{box-shadow:inset 0 0 0 2px var(--dig),var(--sh)}
.slot .dot{position:absolute;top:6px;right:7px;min-width:10px;height:10px;border-radius:2px;background:var(--dig);color:var(--ink);font:800 10px/10px system-ui;text-align:center;padding:0 2px}
#tabMus .dot{background:var(--info);min-width:16px;height:16px;line-height:16px}
.boost[data-state=ready]{background:#3a1830;box-shadow:inset 0 0 0 2px var(--boost),0 0 16px #ff5fa244,var(--sh);animation:pulse 1.6s ease-in-out infinite}
.boost[data-state=active]{background:#5a1f44;box-shadow:inset 0 0 0 2px #ffd1e6,0 0 24px #ff5fa288,var(--sh)}
.boost[data-state=cool]{background:#22171f}
.boost[data-state=locked]{background:var(--inset);box-shadow:inset 0 0 0 1px var(--line);cursor:default}
.boost .cd{position:absolute;left:0;bottom:0;height:4px;width:calc(var(--p,0)*100%);background:var(--boost)}
.boost[data-state=ready] .cd,.boost[data-state=locked] .cd{display:none}
@keyframes pulse{50%{box-shadow:inset 0 0 0 2px var(--boost),0 0 28px #ff5fa288,var(--sh)}}
/* sheet */
#scrim{position:absolute;inset:0;background:rgba(6,4,8,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82%;display:flex;flex-direction:column;background:var(--raised);border-radius:10px 10px 0 0;overflow:hidden;box-shadow:0 -12px 30px #0009;transform:translateY(105%);transition:transform .28s var(--ease),visibility 0s .28s;visibility:hidden;z-index:11}
.sheet.on{transform:none;visibility:visible;transition:transform .28s var(--ease)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px}
.sheet-h h2{margin:0}
.sheet-b{overflow:auto;padding:4px 14px calc(env(safe-area-inset-bottom) + 20px);overscroll-behavior:contain}
.tip{font-size:13px;color:var(--text3);margin:6px 0}
.sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--text2);padding:8px 0 12px}
.sum span{display:inline-flex;align-items:center;gap:6px}.sum b{color:var(--text)}
.card{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px;background:var(--inset);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:8px}
.card h3{margin:0;font-size:15px}
.card .ic{display:grid;place-items:center}
.pips{display:flex;align-items:center;gap:2px;margin:6px 0 5px}.pips i{width:9px;height:6px;background:#2e2633}.pips i.on{background:var(--dig)}.pips .more{font-size:11px;color:var(--dig);margin-left:4px}
.eff{font-size:13px;color:var(--text2)}.eff b{color:var(--xp)}
.buyw{display:flex;flex-direction:column;align-items:flex-end}
.buy{min-width:88px;height:var(--ctl);border:0;border-radius:var(--r);background:var(--dig);color:var(--ink);font-weight:800;box-shadow:var(--sh);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-variant-numeric:tabular-nums}
.buy:disabled{background:#3a3040;color:var(--text3);box-shadow:none;cursor:not-allowed}
.need{font-size:11px;color:var(--text3);margin-top:5px}
.card.locked{opacity:.75}
.card.flash{animation:cflash .6s ease}
@keyframes cflash{0%{box-shadow:inset 0 0 0 2px var(--xp),0 0 18px #5fbf4a88}}
.mhead{display:flex;flex-direction:column;gap:4px;padding:6px 0 10px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slotm{min-height:104px;border:0;border-radius:var(--r);padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--layer);box-shadow:inset 0 0 0 2px var(--rar),var(--sh);color:var(--text);font-size:11px;line-height:1.25;text-align:center;position:relative;overflow:hidden}
.slotm::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(var(--dirt) 0 2px,var(--clay) 2px 4px,var(--rock) 4px)}
.slotm.unk{background:var(--inset);box-shadow:inset 0 0 0 1px var(--line2);color:var(--text3);cursor:default}
.slotm[aria-pressed=true]{outline:3px solid var(--dig);outline-offset:1px}
.slotm .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slotm .rl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.detail{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;margin-bottom:10px;background:var(--inset);border-radius:var(--r);box-shadow:inset 0 0 0 2px var(--rar)}
.detail .dn{font-weight:800}.detail .dm{font-size:12px;color:var(--text2);margin:2px 0 6px}.detail .df{font-size:14px;color:var(--text)}
.sec{margin:18px 0 8px}
dl.stats{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:14px}
dl.stats dt{color:var(--text3)}dl.stats dd{margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.daily{padding:12px;background:var(--inset);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line)}
.daily.done{box-shadow:inset 0 0 0 1px var(--xp)}
.bar{height:10px;margin-top:8px;background:#2e2633;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--xp)}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.set.col{flex-direction:column;align-items:stretch}
.switch{width:56px;height:32px;border:0;border-radius:16px;background:#3a3040;position:relative;flex:none}
.switch i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:var(--text3);transition:transform .2s var(--ease)}
.switch[aria-checked=true]{background:var(--xp)}.switch[aria-checked=true] i{transform:translateX(24px);background:#fff}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--inset);border-radius:var(--r);padding:3px;gap:3px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{height:38px;border:0;border-radius:3px;background:transparent;color:var(--text2);font-weight:700}
.seg button[aria-checked=true]{background:var(--dig);color:var(--ink)}
.btn{min-height:var(--ctl);padding:0 16px;border:0;border-radius:var(--r);font-weight:800;box-shadow:var(--sh)}
.btn.pri{background:var(--dig);color:var(--ink)}.btn.sec{background:#3a3040;color:var(--text)}.btn.danger{background:var(--danger);color:#1b0b08}
.btn.ghost{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 2px var(--danger)}
textarea{display:block;width:100%;background:var(--inset);color:var(--text);border:0;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line2);font:12px ui-monospace,monospace;padding:8px;margin:8px 0;resize:none;-webkit-user-select:text;user-select:text}
.row2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
#loadMsg{font-size:13px}#loadMsg.err{color:var(--danger)}#loadMsg.ok{color:var(--xp)}
.foot{font-size:12px;color:var(--text3);text-align:center;margin:22px 0 4px}.foot a{color:var(--info)}
.beta{display:inline-grid;place-items:center;height:18px;padding:0 5px;border-radius:3px;background:#3a1830;box-shadow:inset 0 0 0 1px var(--boost)}
/* dialog */
.dlg{position:absolute;inset:0;display:none;place-items:center;background:rgba(6,4,8,.66);z-index:40;padding:24px}
.dlg.on{display:grid}
.dlg-box{width:100%;max-width:320px;background:var(--overlay);border-radius:8px;box-shadow:0 0 0 1px var(--line2),0 14px 34px #000b;overflow:hidden;animation:tin .22s var(--ease)}
.dlg-c{padding:16px}.dlg-c h3{margin:0 0 10px}.dlg-c p{margin:0 0 16px;color:var(--text2);font-size:14px}
.dlg-a{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.dlg-a .btn{flex:1 1 auto}
#intro{position:absolute;inset:0;z-index:50;background:#0b080d;display:flex;align-items:center;justify-content:center;transition:opacity .25s;touch-action:none}#intro canvas{image-rendering:pixelated}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  if(lt<5){const per=Math.max(.07,.5*Math.pow(1-lt/5,1.3));const which=Math.floor(lt/per)%2?e.to:e.from;drawRobot(which,W/2,robotY(),t,{white:true});
   if(Math.floor(lt/per)!==Math.floor((lt-dt)/per))tone(300+lt*90,.08,.05);
   txtC("Wait...",H*.3,22,"#fff");txtC(EVOS[e.from].name+" IS EVOLVING!",H*.36,26,"#ffd75a")}
  else{if(!e.done){e.done=true;S.evo=e.to;flash=1;tone(523,1.2,.08,"triangle");tone(659,1.2,.07,"triangle");tone(784,1.4,.07,"triangle");noise(.6,.12);for(let i=0;i<90;i++){const a=Math.random()*7,v=100+Math.random()*420;parts.push({x:W/2,y:robotY()-30,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1.2,c:Math.random()<.5?"#ffd75a":"#fff"})}save()}
   drawRobot(S.evo,W/2,robotY(),t,{eyes:"happy"});txtC(EVOS[e.from].name+" evolved into",H*.3,20,"#fff");txtC(EVOS[S.evo].name+"!",H*.37,40,EVOS[S.evo].body);
   txtC(EVOS[S.evo].perk,H*.43,15,"#fff");if(lt>8.5)evoAnim=null}}
 else drawRobot(S.evo,W/2,robotY(),t,{eyes:S.jam?"x":(Date.now()-lastTap<400?"happy":"open")});
 // particles
 parts=parts.filter(p=>(p.l-=dt)>0);for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.txt)p.vy+=700*dt;if(p.txt){cx.globalAlpha=Math.min(1,p.l*2);cxPx(p.txt,p.x,p.y-10,2,p.c,"l");cx.globalAlpha=1}else{cx.fillStyle=p.c;cx.fillRect(p.x,p.y,4,4)}}
 if(S.jam){txtC("DRILL JAM!",H*.3,26,"#ff7864");txtC("DOUBLE TAP",H*.37,34,"#ff5078");rr(W*.2,H*.78,W*.6,10,"#3c2832");rr(W*.2,H*.78,W*.6*S.jam.got/S.jam.need,10,"#ff5078")}
 if(Date.now()<S.boostUntil){const g=cx.createRadialGradient(W/2,robotY()-20,5,W/2,robotY()-20,120);g.addColorStop(0,"rgba(255,80,170,.35)");g.addColorStop(1,"rgba(255,80,170,0)");cx.fillStyle=g;cx.fillRect(0,0,W,H)}
 if(flash>0){cx.fillStyle=`rgba(255,255,255,${flash})`;cx.fillRect(0,0,W,H);flash-=dt*2.5}

function txtC(s,y,sz,c){const sc=Math.max(2,Math.round(sz*(W/360)/7));cxPx(s,W/2,y-5*sc,sc,c,"c")}
// ---------- daily challenge + streak
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const dayNum=s=>{const [y,m,d]=s.split("-").map(Number);return Math.floor(Date.UTC(y,m-1,d)/864e5)};
function ensureDaily(){if(S.daily&&S.daily.date===today())return;const t=today(),h=hash(dayNum(t),99),h2=hash(dayNum(t),7);
 let type=["dig","dig","find","unjam","boost"][Math.floor(h*5)];if(type==="boost"&&!hasBattery())type="dig";if(type==="find"&&S.found.length>=FINDS.length)type="dig";
 const target=type==="dig"?niceRound((120+h2*120)*Math.max(.3,mmRate(autoRate()+tapPower()*2))):type==="boost"?2:1;S.daily={date:t,type,target,prog:0,done:false};save()}
function niceRound(v){const p=Math.pow(10,Math.floor(Math.log10(Math.max(1,v))));return Math.max(10,Math.round(v/p)*p)}
function dailyLabel(D){return D.type==="dig"?"dig "+fmtD(D.target).toLowerCase():D.type==="find"?"make 1 new find":D.type==="unjam"?"unjam Digby once":"use BOOST twice"}
function dailyProgTxt(D){return D.type==="dig"?(fmtD(D.prog).toLowerCase()+" / "+fmtD(D.target).toLowerCase()):(D.prog+" / "+D.target)}
function dailyProg(type,n){ensureDaily();const D=S.daily;if(D.done||D.type!==type)return;D.prog=Math.min(D.target,D.prog+n);if(D.prog<D.target)return;
 D.done=true;track("daily",{daily_type:D.type,streak:(S.lastDone===dayNum(D.date)-1)?(S.streak||0)+1:1});const td=dayNum(D.date);S.streak=(S.lastDone===td-1)?(S.streak||0)+1:(S.lastDone===td?(S.streak||1):1);S.lastDone=td;
 const mult=Math.min(2,1+0.1*(S.streak-1)),k=1+S.evo;const xp=Math.round(300*mult*k),dirt=Math.round(Math.max(200,90*(autoRate()+tapPower()*2))*mult);S.dirt+=dirt;addXP(xp);
 toast("DAILY DONE!",S.streak+" day streak · +"+xp+" XP · +"+fmtC(dirt)+" dirt","#ffd75a",2.8);tone(784,.2,.08,"triangle");tone(1046,.3,.08,"triangle",.12);tone(1568,.4,.07,"triangle",.26);save()}
// ---------- save code export / import (no server)
function checksum(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function exportCode(){const d=Object.assign({},S);delete d.jam;d.v=3;const b=btoa(unescape(encodeURIComponent(JSON.stringify(d))));return "DIGBY1-"+b+"-"+checksum(b)}
function importCode(c){c=(c||"").trim().replace(/\s+/g,"");const m=c.match(/^DIGBY1-([A-Za-z0-9+\/=]+)-([a-z0-9]+)$/);if(!m||checksum(m[1])!==m[2])throw new Error("bad");
 const d=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(typeof d.mm!=="number"||typeof d.xp!=="number")throw new Error("bad");return d}

(()=>{const away=Math.min(8*3600,(Date.now()-(S.last||Date.now()))/1000);const a=autoRate();if(away>60&&a>0){offMM=digEffort(away*a*.5,true)}})();
for(const f of FINDS)if(f[0]<S.mm&&!S.found.includes(f[1]))foundRelic(f,true);
if(S.seenFinds===undefined)S.seenFinds=S.museum.length;
document.addEventListener("pointerup",()=>{try{if(AC&&AC.state!=="running")AC.resume()}catch(e){}});
const introOpts=()=>({depth:DigbyIntro.fmt(S.mm),away:offMM,ac,acLive:()=>!!AC,muted:S.muted,reduce:matchMedia("(prefers-reduced-motion: reduce)").matches});
function betaNote(){if(S.betaSeen)return;S.betaSeen=true;save();setTimeout(async()=>{const ok=await ask({title:"WELCOME TO THE BETA",text:"Digby is still being built: layers, relics and features keep changing. Your progress is saved on this device, and a save code in the Journal lets you move it.",yes:"Let's dig",no:"Privacy info"});if(!ok)window.open("privacy.html","_blank","noopener")},S.mm===0?2800:600)}
function bootToasts(intro){betaNote();if(offFinds.length)setTimeout(()=>toast("WHILE YOU WERE AWAY",offFinds.length+" new relic"+(offFinds.length>1?"s":"")+": "+offFinds.slice(-2).join(", "),"#ffd75a",3.2),intro?0:3200);if(offMM>0&&!intro)toast("WELCOME BACK","While you were away Digby dug "+fmtD(offMM).toLowerCase(),"#4fe0f0",3);else if(S.mm===0)toast("DIGBY","Tap anywhere to help him dig to the core","#f5c542",2.6)}
syncSnd();hud();

 track("open",{returning:!!S.seenIntro,intro_mode:mode||"off"});
 if(!mode){bootToasts(false);return}S.seenIntro=true;save();DigbyIntro.play(mode,introOpts(),()=>{bootToasts(true);offMM=0;cv.focus({preventScroll:true})})})();
